<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    
    <link href="style.css" rel="stylesheet">

    

<script>
    async function pesquisarCEP() {
        const cepInput = document.getElementById("cep");
        let cep = cepInput.value.replace(/\D/g, '');
        const mensagem = document.getElementById("mensagem");

        mensagem.textContent = "";
        limparEndereco();

        if (cep.length !== 8) {
            mensagem.textContent = "CEP inválido! Digite 8 números.";
            return;
        }

        try {
            const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
            
            if (!response.ok) throw new Error("Erro na consulta");

            const conteudo = await response.json();

            if (!conteudo.erro) {
                document.getElementById("rua").value = conteudo.logradouro || "";
                document.getElementById("bairro").value = conteudo.bairro || "";
                document.getElementById("cidade").value = conteudo.localidade || "";
                document.getElementById("estado").value = conteudo.uf || "";
            } else {
                mensagem.textContent = "CEP não encontrado!";
            }
        } catch (error) {
            mensagem.textContent = "Erro ao buscar o CEP. Tente novamente.";
            console.error(error);
        }
    }

    function limparEndereco() {
        document.getElementById("rua").value = "";
        document.getElementById("bairro").value = "";
        document.getElementById("cidade").value = "";
        document.getElementById("estado").value = "";
    }
</script>
</head>
<body>
    <div class="container">
        <h1>Cadastro de Clientes</h1>
        
        <form id="formCadastro">
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" required class="input_texto">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required class="input_texto">
            <label for="dt_nasc">Data de nascimento:</label>
            <input type="date" id="dt_nasc" required class="input_texto">
            <label for="email">E-mail:</label>
            <input type="email" id="email" required class="input_texto">
            <label for="celular">Celular:</label>
            <input type="tel" id="celular" placeholder="(99) 99999-9999" required class="input_texto">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" minlength="6" required class="input_texto">
            <label for="confirmar_senha">Confirmar Senha:</label>
            <input type="password" id="confirmar_senha" minlength="6" required class="input_texto">
            <label for="cep">CEP:</label>
            <input type="text" id="cep" placeholder="00000-000" maxlength="9" 
       onblur="pesquisarCEP()" required class="input_texto">
            <label for="rua">Rua:</label>
            <input type="text" id="rua" required class="input_texto">
            <label for="numero">Número:</label>
            <input type="text" id="numero" placeholder="123" required class="input_texto">
            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" required class="input_texto">
            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" required class="input_texto">
            <label for="estado">Estado (UF):</label>
            <input type="text" id="estado" maxlength="2" required class="input_texto">
            <p id="mensagem" class="mensagem"></p>
            <input type="submit" value="Enviar Cadastro" class="btn_enviar">
        </form>
    </div>
</body>
</html>
